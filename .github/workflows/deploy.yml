name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Or use 'master' if that's your default

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🧱 Build Backend Docker Image
        run: docker build -t backend-image ./server

      - name: 🧱 Build Frontend Docker Image
        run: docker build -t frontend-image ./tasks

      # OPTIONAL: Add tests later
      # - name: Run Tests
      #   run: docker run backend-image npm test
